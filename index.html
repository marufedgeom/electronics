<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ROBIUL ELECTRONICS · ERP 2027</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar" id="mainNav">
        <div class="navbar-brand">
            <i class="fas fa-microchip"></i>
            ROBIUL ELECTRONICS
            <span class="badge">ERP 2027</span>
        </div>
        <div class="nav-actions">
            <div class="lang-switch" id="langSwitch">
                <button class="active" data-lang="en">EN</button>
                <button data-lang="bn">বাংলা</button>
                <button data-lang="ar">العربية</button>
            </div>
            <button class="nav-btn accent"><i class="fas fa-user-shield"></i> Admin</button>
            <button class="nav-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </nav>

    <!-- SIDEBAR + MAIN CONTENT (will be injected by JS) -->
    <div id="app-root"></div>

    <!-- IMAGE EDITOR MODAL -->
    <div class="modal-overlay" id="imageEditorModal">
        <div class="modal-editor">
            <div class="modal-title">
                <span><i class="fas fa-edit" style="color:var(--accent);"></i> Image Editor</span>
                <button class="close-btn" id="closeEditorBtn">✕</button>
            </div>
            <div class="editor-tools">
                <button id="rotateBtn"><i class="fas fa-undo"></i> Rotate</button>
                <button id="cropBtn"><i class="fas fa-crop"></i> Crop</button>
                <button id="brightnessBtn"><i class="fas fa-sun"></i> Brightness</button>
                <button id="contrastBtn"><i class="fas fa-adjust"></i> Contrast</button>
                <button id="resetImgBtn"><i class="fas fa-undo-alt"></i> Reset</button>
            </div>
            <div class="editor-canvas-wrap">
                <canvas id="imgEditorCanvas" width="400" height="300"></canvas>
            </div>
            <div class="editor-actions">
                <button class="btn btn-primary" id="uploadImageBtn"><i class="fas fa-upload"></i> Upload New</button>
                <button class="btn btn-accent" id="saveImageBtn"><i class="fas fa-check"></i> Save Changes</button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
